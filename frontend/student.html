<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .nav {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }
    .nav button {
      flex: 1;
      margin: 0 5px;
      padding: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎓 Welcome to Student Dashboard</h1>

    <div class="nav">
      <button onclick="showSection('profileSection')">Profile</button>
      <button onclick="showSection('paymentSection')">Make Payment</button>
      <button onclick="showSection('checkSection')">Check-In/Out</button>
    </div>

    <div id="profileSection" class="card"></div>
    <div id="paymentSection" class="card" style="display:none">
      <h2>💳 Make a Payment</h2>
      <label>Amount: ₹</label>
      <input type="number" id="amountInput" min="1" step="0.01" required />
      <br><br>
      <label>Description (optional):</label>
      <input type="text" id="descInput" placeholder="e.g. Hostel fee, Laundry, etc." />
      <br><br>
      <button onclick="makePayment()">💰 Pay Now</button>
    
      <h3>🧾 Recent Transactions</h3>
      <ul id="paymentLogs">
        <li>Loading payment history...</li>
      </ul>
    </div>
    
    <div id="checkSection" class="card" style="display:none">
      <h2>🕒 Check-In / Check-Out</h2>
    
      <div style="margin-bottom: 10px;">
        <button onclick="handleCheckIn()">✅ Check In</button>
        <button onclick="handleCheckOut()">⬅️ Check Out</button>
      </div>
    
      <h3>📜 Check-In/Out History</h3>
      <ul id="logList">
        <li>Loading logs...</li>
      </ul>
    </div>
    
  </div>

  <script>
   let studentId;

window.addEventListener("DOMContentLoaded", () => {
  const urlParams = new URLSearchParams(window.location.search);
  studentId = urlParams.get('id');
  console.log("Extracted studentId:", studentId);

  if (studentId) {
    fetchStudent(); // call it *after* studentId is set
  } else {
    alert("Student ID not found in URL.");
  }
});
    function showSection(sectionId) {
      ['profileSection', 'paymentSection', 'checkSection'].forEach(id => {
        document.getElementById(id).style.display = id === sectionId ? 'block' : 'none';
      });
    }

    async function fetchStudent() {
      const res = await fetch(`http://localhost:3000/getStudent/${studentId}`);
      const data = await res.json();
      console.log("Full response from backend:", data);
      const s = data.student;
      const room = s.Room;

      document.getElementById("profileSection").innerHTML = `
        <h2>👤 Student Profile</h2>
        <p><strong>Name:</strong> ${s.Name}</p>
        <p><strong>Roll Number:</strong> ${s.RollNumber}</p>
        <p><strong>Email:</strong> ${s.Email}</p>
        <p><strong>Phone:</strong> ${s.Phone}</p>
        <h3>🏠 Room Details</h3>
        <p><strong>Room Number:</strong> ${room.RoomNumber}</p>
        <p><strong>Capacity:</strong> ${room.Capacity}</p>
        <p><strong>Occupied:</strong> ${room.Occupied}</p>
      `;
    }
    async function handleCheckIn() {
    try {
      const res = await fetch("http://localhost:3000/checkin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ student_id: parseInt(studentId) })
      });

      const data = await res.json();

      if (res.ok) {
        alert("✅ Checked in successfully at " + new Date(data.CheckIn).toLocaleString());
        loadCheckLogs();
      } else {
        alert("❌ Check-in failed: " + data.error);
      }
    } catch (error) {
      console.error("Check-in error:", error);
      alert("❌ Error during check-in");
    }
  }

  async function handleCheckOut() {
    try {
      const res = await fetch("http://localhost:3000/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ student_id: parseInt(studentId) })
      });

      const data = await res.json();

      if (res.ok) {
        alert("⬅️ Checked out successfully at " + new Date(data.CheckOut).toLocaleString());
        loadCheckLogs();
      } else {
        alert("❌ Check-out failed: " + data.error);
      }
    } catch (error) {
      console.error("Check-out error:", error);
      alert("❌ Error during check-out");
    }
  }

  async function loadCheckLogs() {
    try {
      const res = await fetch(`http://localhost:3000/getStudent/${studentId}`);
      const data = await res.json();

      const logs = data.check_in_out_logs || [];
      const logList = document.getElementById("logList");
      logList.innerHTML = "";

      if (logs.length === 0) {
        logList.innerHTML = "<li>No check-in/out records found.</li>";
        return;
      }

      logs.forEach(log => {
        logList.innerHTML += `<li>🟢 In: ${log.check_in} | 🔴 Out: ${log.check_out ?? "—"}</li>`;
      });
    } catch (error) {
      console.error("Error loading logs:", error);
      document.getElementById("logList").innerHTML = "<li>❌ Failed to load logs</li>";
    }
  }

  // Automatically load logs once student ID is ready
  window.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    studentId = urlParams.get('id');
    if (studentId) {
      fetchStudent();
      loadCheckLogs();
    }
  });

  async function makePayment() {
    const amount = parseFloat(document.getElementById("amountInput").value);
    const desc = document.getElementById("descInput").value;

    if (!amount || amount <= 0) {
      alert("Please enter a valid amount.");
      return;
    }

    const res = await fetch("http://localhost:3000/makePayment", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        student_id: parseInt(studentId),
        amount: amount,
        description: desc
      })
    });

    const data = await res.json();

    if (res.ok) {
      alert(`✅ Payment successful! Transaction ID: ${data.transaction_id}`);
      document.getElementById("amountInput").value = "";
      document.getElementById("descInput").value = "";
      loadPayments();
    } else {
      alert("❌ Payment failed: " + data.error);
    }
  }

  async function loadPayments() {
  try {
    const res = await fetch(`http://localhost:3000/payments?student_id=${studentId}`);
    const data = await res.json();
    const payments = data.payments || [];

    const list = document.getElementById("paymentLogs");
    list.innerHTML = "";

    if (payments.length === 0) {
      list.innerHTML = "<li>No payments made yet.</li>";
      return;
    }

    payments.forEach(p => {
  list.innerHTML += `
    <li>₹${p.Amount} | ${new Date(p.PaidAt).toLocaleString()} | TXN: ${p.TransactionID}</li>
  `;
});

  } catch (err) {
    console.error("Failed to load payments:", err);
    document.getElementById("paymentLogs").innerHTML = "<li>❌ Error loading payment history</li>";
  }
}


  // Load payments when switching to payment tab
  document.querySelector("button[onclick=\"showSection('paymentSection')\"]").addEventListener("click", loadPayments);

    //fetchStudent();
  </script>
</body>
</html>
