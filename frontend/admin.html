<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <h1>Admin Dashboard - Hall 14</h1>
    <ul class="nav-links">
      <li><a href="#" onclick="showRooms()">Rooms</a></li>
      <li><a href="#" onclick="showStudents()">Students</a></li>
      <li><a href="#" onclick="showCheckInOut()">Check-In/Out</a></li>

      <li><a href="#" onclick="showPayments()">Payments</a></li>

      <li><a href="#">Profile</a></li>
    </ul>
  </nav>

  <main class="container">
    <div id="output">
      <p>Select an option from the navbar to view data.</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Hall 14 Hostel Management System | NIT Durgapur</p>
  </footer>

  <script>
    const baseUrl = "http://localhost:3000";

    async function showRooms() {
      const res = await fetch(baseUrl + "/getRooms");
      const data = await res.json();

      let html = `
        <h2>All Rooms</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>Room Number</th>
              <th>Occupied / Max Beds</th>
              <th>Students</th>
            </tr>
          </thead>
          <tbody>
      `;

      data.forEach(room => {
        html += `
          <tr>
            <td>${room.room_number}</td>
            <td>${room.occupied_beds} / ${room.max_beds}</td>
            <td>${room.students.join(', ')}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      document.getElementById("output").innerHTML = html;
    }

    async function showStudents() {
      const res = await fetch(baseUrl + "/getStudents");
      const data = await res.json();

      let html = `
        <h2>All Students</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Roll Number</th>
              <th>Room</th>
            </tr>
          </thead>
          <tbody>
      `;

      data.forEach(s => {
        const roomNumber = s.Room?.RoomNumber || "Not Assigned";
        html += `
          <tr>
            <td>${s.Name}</td>
            <td>${s.RollNumber}</td>
            <td>${roomNumber}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      document.getElementById("output").innerHTML = html;
    }
    async function showCheckInOut() {
      const res = await fetch(baseUrl + "/checkinoutRecords");
      const data = await res.json();

      let html = `
        <h2>Check-In / Check-Out Logs</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Roll Number</th>
              <th>Check-In Time</th>
              <th>Check-Out Time</th>
            </tr>
          </thead>
          <tbody>
      `;

      data.forEach(log => {
        html += `
          <tr>
            <td>${log.student_name}</td>
            <td>${log.roll_number}</td>
            <td>${log.check_in}</td>
            <td>${log.check_out}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      document.getElementById("output").innerHTML = html;
    }
    async function showPayments() {
    const res = await fetch(baseUrl + "/getStudents");
    const students = await res.json();

    let html = `
      <h2>Student Payments</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Room</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
    `;

    students.forEach(s => {
      const roomNumber = s.Room?.RoomNumber || "Not Assigned";
      html += `
        <tr>
          <td>${s.Name}</td>
          <td>${s.RollNumber}</td>
          <td>${roomNumber}</td>
          <td><button onclick="loadStudentPayments(${s.ID}, '${s.Name}')">View Payment History</button></td>
        </tr>
      `;
    });

    html += `</tbody></table>
      <div id="paymentDetails" style="margin-top: 20px;"></div>
    `;

    document.getElementById("output").innerHTML = html;
  }

  async function loadStudentPayments(studentId, studentName) {
    try {
      const res = await fetch(`${baseUrl}/payments?student_id=${studentId}`);
      const data = await res.json();
      const payments = data.payments || [];

      let html = `<h3>Payment History for ${studentName}</h3>`;

      if (payments.length === 0) {
        html += "<p>No payments found for this student.</p>";
      } else {
        html += `
          <table class="data-table">
            <thead>
              <tr>
                <th>Amount</th>
                <th>Description</th>
                <th>Date</th>
                <th>Transaction ID</th>
              </tr>
            </thead>
            <tbody>
        `;

        payments.forEach(p => {
          html += `
            <tr>
              <td>₹${p.Amount}</td>
              <td>${p.Description}</td>
              <td>${new Date(p.PaidAt).toLocaleString()}</td>
              <td>${p.TransactionID}</td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
      }

      document.getElementById("paymentDetails").innerHTML = html;
    } catch (err) {
      console.error("Error loading payments:", err);
      document.getElementById("paymentDetails").innerHTML = "<p>❌ Failed to load payments</p>";
    }
  }

  </script>
</body>
</html>
